alse, "story_key": "O02", "script_speech": "先看一个具体任务：一幅图像混入了规则条纹。我们希望去掉干扰，同时保住原来的边缘和纹理。这个任务会引出今天需要的数学工具。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O02"], "original_stop_ids": [2], "rehearsal_original_page": 2, "topic": "图像干扰", "duration": 2.066666666666667, "cues": [2.033333], "cue_labels": [""], "animation_cues": [1.8], "animation_labels": ["从图像问题出发"], "playback": "whole"}, {"id": 3, "chapter": 2, "title": "原图与周期条纹的叠加", "detail": "原图与周期条纹的叠加", "kind": "content", "part": 1, "part_title": "从图像到傅里叶基", "src": "slides/files/rehearsal/RIntro.mp4", "poster": "rehearsal/posters/N01.png", "overflow": [], "story_key": "N01", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n先看左边的原图，再加入中间的周期条纹，右边就是两者叠加的观测图。规则干扰覆盖在图像内容之上。我们希望去掉它，同时保住边缘和细纹理。", "script_speech": "先看左边的原图，再加入中间的周期条纹，右边就是两者叠加的观测图。规则干扰覆盖在图像内容之上。我们希望去掉它，同时保住边缘和细纹理。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N01"], "original_stop_ids": [3], "rehearsal_original_page": 3, "topic": "条纹叠加", "cues": [4.1], "cue_labels": [""], "duration": 4.133333333333334, "motion": {"kind": "native", "scene": "RIntro"}, "animation_cues": [0.9, 1.8, 2.8, 4.1], "animation_labels": ["出现原图", "加入周期条纹", "合成条纹观测图", "写出加性干扰模型"], "playback": "whole"}, {"id": 4, "chapter": 9, "title": "半透明文字叠加与去水印结果", "part": 1, "part_title": "从图像到傅里叶基", "kind": "content", "detail": "半透明文字叠加与去水印结果", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n干扰也可以是半透明文字。左边是原图，第二张是文字层，第三张是叠加后的图像，最右边是去掉这层文字后的恢复结果。这个例子里，我们知道文字层及其透明度，所以可以把叠加关系反解，得到恢复图。接下来回到周期条纹，看看空间平滑与频域选择的处理结果有什么差别。", "overflow": [], "src": "slides/files/rehearsal/RWatermark.mp4", "poster": "rehearsal/posters/RWatermark.png", "original_id": 33, "transition_trimmed": false, "story_key": "RWatermark", "script_speech": "干扰也可以是半透明文字。左边是原图，第二张是文字层，第三张是叠加后的图像，最右边是去掉这层文字后的恢复结果。这个例子里，我们知道文字层及其透明度，所以可以把叠加关系反解，得到恢复图。接下来回到周期条纹，看看空间平滑与频域选择的处理结果有什么差别。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O33"], "original_stop_ids": [50], "rehearsal_original_page": 3, "topic": "叠加与恢复", "cues": [4.566667], "cue_labels": [""], "duration": 4.6, "motion": {"kind": "native", "scene": "RWatermark"}, "animation_cues": [0.966667, 1.933333, 3.0, 4.566667], "animation_labels": ["显示原图", "显示半透明文字层", "显示叠加后的水印图", "显示按已知文字层及透明度反解得到的去水印结果"], "playback": "whole"}, {"id": 5, "chapter": 2, "title": "空间平滑与频域选择的比较", "detail": "空间平滑与频域选择的比较", "kind": "content", "part": 1, "part_title": "从图像到傅里叶基", "src": "slides/files/rehearsal/RCompare.mp4", "poster": "rehearsal/posters/N02.png", "overflow": [], "story_key": "N02", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n两种处理都从同一张受周期条纹干扰的图开始。第一条路径是在空间中做高斯卷积，标准差为两个像素；它通过附近像素的加权平均整体平滑。第二条路径先做 FFT，只将已知条纹对应的正负两个共轭频率系数置零，再做逆变换。右边是干净参照，下面放大的是四张图的同一纹理区域。高斯模糊压低条纹时，也压低原图细纹理；这个合成例子的条纹集中在两个已知频率，因此陷波能较好保留其他频率的内容。陷波并不只认得噪声，原图在同一频率上的系数也会被一并删除。", "script_speech": "两种处理都从同一张受周期条纹干扰的图开始。第一条路径是在空间中做高斯卷积，标准差为两个像素；它通过附近像素的加权平均整体平滑。第二条路径先做 FFT，只将已知条纹对应的正负两个共轭频率系数置零，再做逆变换。右边是干净参照，下面放大的是四张图的同一纹理区域。高斯模糊压低条纹时，也压低原图细纹理；这个合成例子的条纹集中在两个已知频率，因此陷波能较好保留其他频率的内容。陷波并不只认得噪声，原图在同一频率上的系数也会被一并删除。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N02"], "original_stop_ids": [4], "rehearsal_original_page": 4, "topic": "两种滤波", "cues": [7.0], "cue_labels": [""], "duration": 7.033333333333333, "motion": {"kind": "native", "scene": "RCompare"}, "animation_cues": [0.9, 1.9, 2.9, 3.9, 4.8, 5.8, 7.0], "animation_labels": ["取同一张条纹观测图", "为两条处理路径留出位置", "显示空间高斯卷积结果", "显示共轭陷波重建结果", "加入干净图像参照", "并排放大同一纹理区域", "比较纹理保留与干扰消除"], "playback": "whole"}, {"id": 6, "chapter": 2, "title": "傅里叶基：用不同频率表示变化", "detail": "傅里叶基：用不同频率表示变化", "kind": "content", "part": 1, "part_title": "从图像到傅里叶基", "src": "slides/files/rehearsal/N11.mp4", "poster": "rehearsal/posters/N11.png", "overflow": [], "story_key": "N11", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n刚才我们希望换一种坐标，让图像里的周期结构集中显现出来。对于周期信号，自然的选择是不同频率的正弦和余弦。它们既能描述不同间距的变化，又有一个方便的性质：不同整数频率在完整周期上正交。\n\n看上面的两个余弦。把它们相乘后，下面出现正负两种面积，在完整周期上互相抵消，积分为零。因此，投影到其中一个频率时，另一个频率的贡献会抵消。我们可以分别测出各个频率的系数。", "script_speech": "刚才我们希望换一种坐标，让图像里的周期结构集中显现出来。对于周期信号，自然的选择是不同频率的正弦和余弦。它们既能描述不同间距的变化，又有一个方便的性质：不同整数频率在完整周期上正交。\n\n看上面的两个余弦。把它们相乘后，下面出现正负两种面积，在完整周期上互相抵消，积分为零。因此，投影到其中一个频率时，另一个频率的贡献会抵消。我们可以分别测出各个频率的系数。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N11"], "original_stop_ids": [16], "rehearsal_original_page": 11, "topic": "频率正交", "cues": [6.966667], "cue_labels": [""], "duration": 7.0, "motion": {"kind": "native", "scene": "N11"}, "animation_cues": [1.2, 2.4, 4.1, 6.966667], "animation_labels": ["", "", "", ""], "playback": "whole"}, {"id": 7, "chapter": 2, "title": "复指数把两种投影装进一次旋转", "detail": "复指数把两种投影装进一次旋转", "kind": "content", "part": 1, "part_title": "从图像到傅里叶基", "src": "slides/files/rehearsal/N12.mp4", "poster": "rehearsal/posters/N12.png", "overflow": [], "story_key": "N12", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n复平面里，一根匀速旋转的单位箭头，在实轴和虚轴上的投影分别是余弦和正弦。欧拉公式用一个复指数把两者装在一起。\n\n这样，频率就是旋转快慢，相位就是初始朝向；复指数相乘又可以直接合并指数。除了直观，它还让“某个频率有多少”变成一个很容易计算的投影问题。", "script_speech": "复平面里，一根匀速旋转的单位箭头，在实轴和虚轴上的投影分别是余弦和正弦。欧拉公式用一个复指数把两者装在一起。\n\n这样，频率就是旋转快慢，相位就是初始朝向；复指数相乘又可以直接合并指数。除了直观，它还让“某个频率有多少”变成一个很容易计算的投影问题。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N12"], "original_stop_ids": [17], "rehearsal_original_page": 12, "topic": "复指数", "cues": [9.766667], "cue_labels": [""], "duration": 9.8, "motion": {"kind": "native", "scene": "N12"}, "animation_cues": [1.2, 5.4, 6.9, 9.766667], "animation_labels": ["", "", "", ""], "playback": "whole"}, {"id": 8, "chapter": 0, "kind": "native", "overflow": [], "src": "slides/files/rehearsal/C03a-segment.mp4", "motion": {"kind": "native", "scene": "C03"}, "story_key": "C03a", "original_story_keys": ["C03"], "original_stop_ids": [], "part": 2, "part_title": "FFT 的复用与 N=8 运算", "title": "同一组采样值，可以复用同一份结果", "detail": "同一组采样值，可以复用同一份结果", "script_speech": "计算机记录的是有限个采样点。这里在一个周期内等间距取八点；对这八个数做离散傅里叶变换，就是用八个采样位置上的复指数权重分别乘样本，再相加。先看采样带来的一条重要规律。\n\n看频率一和频率九：连续曲线明显不同，但只观察这八个等间隔采样位置，两条曲线的值却逐一重合。上面是复指数的实部，下面是虚部；两部分都相同，才能说复数采样向量相同。\n\n现在把连续曲线淡掉，只留下采样点。我们就看不出原来是哪一条连续波了：频率一与频率九在这八个样本上对应同一个基向量。停在这个等式上，下一页再把这一对频率推广到全部频率。\n\n对应的复数采样向量完全相同，与信号做离散内积也就得到同一结果。因此 X九就是 X一，这份计算可以直接复用。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n计算机记录的是有限个采样点。这里在一个周期内等间距取八点；对这八个数做离散傅里叶变换，就是用八个采样位置上的复指数权重分别乘样本，再相加。先看采样带来的一条重要规律。\n\n看频率一和频率九：连续曲线明显不同，但只观察这八个等间隔采样位置，两条曲线的值却逐一重合。上面是复指数的实部，下面是虚部；两部分都相同，才能说复数采样向量相同。\n\n现在把连续曲线淡掉，只留下采样点。我们就看不出原来是哪一条连续波了：频率一与频率九在这八个样本上对应同一个基向量。停在这个等式上，下一页再把这一对频率推广到全部频率。\n\n对应的复数采样向量完全相同，与信号做离散内积也就得到同一结果。因此 X九就是 X一，这份计算可以直接复用。", "poster": "rehearsal/posters/C03a.png", "rehearsal_original_page": 19, "topic": "采样重合", "cues": [15.1], "cue_labels": [""], "duration": 15.133333333333333, "animation_cues": [1.6, 4.0, 5.3, 6.366667, 7.066667, 7.766667, 8.466667, 9.166667, 9.866667, 10.566667, 11.266667, 11.966667, 13.5, 15.1], "animation_labels": ["", "", "", "", "", "", "", "", "", "", "", "", "", ""], "playback": "whole"}, {"id": 9, "chapter": 0, "kind": "native", "overflow": [], "src": "slides/files/rehearsal/C03b-segment.mp4", "motion": {"kind": "native", "scene": "C03"}, "story_key": "C03b", "original_story_keys": ["C03"], "original_stop_ids": [], "part": 2, "part_title": "FFT 的复用与 N=8 运算", "title": "频率每隔N重复，只保留N个代表", "detail": "频率每隔N重复，只保留N个代表", "script_speech": "这不是一和九的巧合。上排是零到七，下排是八到十五；每一对相差八的频率都会给出相同的八维复数向量。把下面一排叠上去，所有对应项都重合。\n\n一般地，频率增加N，采样权重只多出e的二πin次方，它在整数n处等于一。因此离散内积也相同，只需要保留N个不同的频率代表。\n\n这里相同的是采样权重与离散求和，不能说两条连续波的积分总相同。有限样本也不能单独判断原始信号到底含有哪个连续高频，这正是混叠现象。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n这不是一和九的巧合。上排是零到七，下排是八到十五；每一对相差八的频率都会给出相同的八维复数向量。把下面一排叠上去，所有对应项都重合。\n\n一般地，频率增加N，采样权重只多出e的二πin次方，它在整数n处等于一。因此离散内积也相同，只需要保留N个不同的频率代表。\n\n这里相同的是采样权重与离散求和，不能说两条连续波的积分总相同。有限样本也不能单独判断原始信号到底含有哪个连续高频，这正是混叠现象。", "poster": "rehearsal/posters/C03b.png", "rehearsal_original_page": 20, "topic": "频率折叠", "cues": [12.4], "cue_labels": [""], "duration": 12.433333333333334, "animation_cues": [2.766667, 4.3, 7.6, 8.8, 9.866667, 12.4], "animation_labels": ["", "", "", "", "", ""], "playback": "whole"}, {"id": 10, "chapter": 6, "title": "相差N/2的频率，在偶数点相同", "detail": "相差N/2的频率，在偶数点相同", "kind": "content", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "src": "slides/files/rehearsal/N17e-segment.mp4", "poster": "rehearsal/posters/N17e.png", "overflow": [], "story_key": "N17e", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n下面使用另一种关系。前面比较相差N的频率，它们在所有样本上都相同；这里比较相差N除以二的频率。对于八点DFT，就是左边的k与右边的k加四。\n\n先看偶数下标。亮点是零、二、四、六；奇数位置仍以半透明标记和虚线保留，所以我们始终是在八个采样点上比较。对应的偶数采样值完全一样，因为频率增加四以后，偶数点的相位恰好多转整数圈。", "script_speech": "下面使用另一种关系。前面比较相差N的频率，它们在所有样本上都相同；这里比较相差N除以二的频率。对于八点DFT，就是左边的k与右边的k加四。\n\n先看偶数下标。亮点是零、二、四、六；奇数位置仍以半透明标记和虚线保留，所以我们始终是在八个采样点上比较。对应的偶数采样值完全一样，因为频率增加四以后，偶数点的相位恰好多转整数圈。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N17"], "original_stop_ids": [37], "motion": {"kind": "native", "scene": "N17"}, "rehearsal_original_page": 21, "topic": "偶数点", "cues": [6.466667], "cue_labels": [""], "duration": 6.5, "animation_cues": [0.8, 1.5, 2.2, 2.9, 3.6, 4.2, 6.466667], "animation_labels": ["", "", "", "", "", "", ""], "playback": "whole"}, {"id": 11, "chapter": 6, "title": "同一对频率，在奇数点只差负号", "detail": "同一对频率，在奇数点只差负号", "kind": "content", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "src": "slides/files/rehearsal/N17o-segment.mp4", "poster": "rehearsal/posters/N17o.png", "overflow": [], "story_key": "N17o", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n再看奇数下标。一、三、五、七这些位置变亮，偶数位置保留为半透明参考。对应值现在恰好差一个负号。\n\n先看实部，再切换到虚部，这个规律都成立，所以它适用于完整的复指数。合起来，就是右边等于左边乘以负一的n次方：n为偶数时相同，n为奇数时相反。\n\n这个“偶同奇反”的结构提示我们，把求和按样本下标的奇偶拆开，就有机会复用计算。", "script_speech": "再看奇数下标。一、三、五、七这些位置变亮，偶数位置保留为半透明参考。对应值现在恰好差一个负号。\n\n先看实部，再切换到虚部，这个规律都成立，所以它适用于完整的复指数。合起来，就是右边等于左边乘以负一的n次方：n为偶数时相同，n为奇数时相反。\n\n这个“偶同奇反”的结构提示我们，把求和按样本下标的奇偶拆开，就有机会复用计算。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N17"], "original_stop_ids": [37], "motion": {"kind": "native", "scene": "N17"}, "rehearsal_original_page": 22, "topic": "奇数点", "cues": [6.966667], "cue_labels": [""], "duration": 7.0, "animation_cues": [1.0, 4.1, 6.966667], "animation_labels": ["", "", ""], "playback": "whole"}, {"id": 12, "chapter": 6, "title": "为什么按下标的奇偶拆分", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "为什么按下标的奇偶拆分", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n把输入按下标分成偶数组和奇数组。这里的奇偶说的是位置，和样本值无关。这样下标分别写成二r和二r加一，就能用上刚才单位根平方的关系。", "overflow": [], "src": "slides/files/rehearsal/O21-segment.mp4", "poster": "rehearsal/posters/O21.png", "original_id": 21, "transition_trimmed": true, "story_key": "O21", "script_speech": "把输入按下标分成偶数组和奇数组。这里的奇偶说的是位置，和样本值无关。这样下标分别写成二r和二r加一，就能用上刚才单位根平方的关系。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O21"], "original_stop_ids": [38], "rehearsal_original_page": 24, "topic": "奇偶拆分", "cues": [3.966667], "cue_labels": [""], "duration": 4.0, "motion": {"kind": "native", "scene": "RSplitting"}, "animation_cues": [1.3, 3.0, 3.966667], "animation_labels": ["仍然是同一组八个输入", "按输入下标分成奇偶两组", "用 m 重新编号"], "playback": "whole"}, {"id": 13, "chapter": 6, "title": "把同一个求和改写成两部分", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "把同一个求和改写成两部分", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n原来的求和分成两部分。偶数项的指数包含二r；奇数项多出的那个一，产生一个不随r变化的旋转因子，可以提到求和外面。\n\n每个原始项都还在，我们只是把计算重新分了组。", "overflow": [], "src": "slides/files/rehearsal/O22-segment.mp4", "poster": "rehearsal/posters/O22.png", "original_id": 22, "transition_trimmed": false, "story_key": "O22", "script_speech": "原来的求和分成两部分。偶数项的指数包含二r；奇数项多出的那个一，产生一个不随r变化的旋转因子，可以提到求和外面。\n\n每个原始项都还在，我们只是把计算重新分了组。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O22"], "original_stop_ids": [39], "rehearsal_original_page": 25, "topic": "拆开求和", "cues": [4.866667], "cue_labels": [""], "duration": 4.9, "motion": {"kind": "native", "scene": "RSplitting"}, "animation_cues": [1.866667, 3.266667, 4.866667], "animation_labels": ["从原始 DFT 求和出发", "偶数项加上奇数项", "奇数项提出一个共同的旋转因子"], "playback": "whole"}, {"id": 14, "chapter": 6, "title": "隔一个样本取一次，旋转步长也平方", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "隔一个样本取一次，旋转步长也平方", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n偶数下标写成二m后，指数里就出现二mk。把其中的二放到单位根上，得到ω下标N的平方。\n\n展开定义就能看清：指数里的二与分母N结合，等价于把分母换成N除以二，所以ω下标N的平方就是ω下标N除以二。先停在这一步，它是把原来的求和认作较短DFT的关键。", "overflow": [], "src": "slides/files/rehearsal/O23a-segment.mp4", "poster": "rehearsal/posters/O23a.png", "original_id": 23, "transition_trimmed": false, "story_key": "O23a", "script_speech": "偶数下标写成二m后，指数里就出现二mk。把其中的二放到单位根上，得到ω下标N的平方。\n\n展开定义就能看清：指数里的二与分母N结合，等价于把分母换成N除以二，所以ω下标N的平方就是ω下标N除以二。先停在这一步，它是把原来的求和认作较短DFT的关键。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O23"], "original_stop_ids": [40], "motion": {"kind": "native", "scene": "R23"}, "rehearsal_original_page": 26, "topic": "单位根平方", "cues": [4.066667], "cue_labels": [""], "duration": 4.1, "animation_cues": [1.6, 4.066667], "animation_labels": ["", ""], "playback": "whole"}, {"id": 15, "chapter": 6, "title": "两个子求和，正好是长度减半的DFT", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "两个子求和，正好是长度减半的DFT", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n有了刚才的恒等式，两个子求和都使用长度N除以二的DFT权重。我们分别把偶数子序列的结果记作E，把奇数子序列的结果记作O。\n\n于是原来的输出可以写成E下标k，加上ω下标N的k次方乘O下标k。奇数项多出的那个旋转因子，需要在合并时乘回去。", "overflow": [], "src": "slides/files/rehearsal/O23b-segment.mp4", "poster": "rehearsal/posters/O23b.png", "original_id": 23, "transition_trimmed": false, "story_key": "O23b", "script_speech": "有了刚才的恒等式，两个子求和都使用长度N除以二的DFT权重。我们分别把偶数子序列的结果记作E，把奇数子序列的结果记作O。\n\n于是原来的输出可以写成E下标k，加上ω下标N的k次方乘O下标k。奇数项多出的那个旋转因子，需要在合并时乘回去。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O23"], "original_stop_ids": [40], "motion": {"kind": "native", "scene": "R23"}, "rehearsal_original_page": 27, "topic": "两个子DFT", "cues": [3.266667], "cue_labels": [""], "duration": 3.3, "animation_cues": [1.4, 3.266667], "animation_labels": ["", ""], "playback": "whole"}, {"id": 16, "chapter": 7, "title": "先计算可复用的旋转因子乘积", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "先计算可复用的旋转因子乘积", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n现在看怎样把两个子变换合起来。左边是E下标k和O下标k；乘法框出现时，下面就标出w等于ω下标N的k次方。\n\n先把奇数子变换乘上这个旋转因子，得到t。这个乘积随后会同时用于两个输出，所以只需要算一次。", "overflow": [], "src": "slides/files/rehearsal/O24-segment.mp4", "poster": "rehearsal/posters/O24.png", "original_id": 24, "transition_trimmed": false, "story_key": "O24", "script_speech": "现在看怎样把两个子变换合起来。左边是E下标k和O下标k；乘法框出现时，下面就标出w等于ω下标N的k次方。\n\n先把奇数子变换乘上这个旋转因子，得到t。这个乘积随后会同时用于两个输出，所以只需要算一次。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O24"], "original_stop_ids": [41], "motion": {"kind": "native", "scene": "RButterfly"}, "rehearsal_original_page": 28, "topic": "旋转因子", "cues": [3.266667], "cue_labels": [""], "duration": 3.3, "animation_cues": [1.4, 3.266667], "animation_labels": ["", ""], "playback": "whole"}, {"id": 17, "chapter": 7, "title": "一次乘法，配合一加一减得到两个输出", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "一次乘法，配合一加一减得到两个输出", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n合并结果有两路：上面做E加t，下面做E减t，分别得到k和k加N除以二的输出。\n\n画面同时给出了它们依据的两条规律：E和O都是长度减半的变换，下标增加N除以二以后不变；但外面的旋转因子会变号。下一页把这两条规律展开一步，就能看到减号从哪里来。", "overflow": [], "src": "slides/files/rehearsal/O25-segment.mp4", "poster": "rehearsal/posters/O25.png", "original_id": 25, "transition_trimmed": false, "story_key": "O25", "script_speech": "合并结果有两路：上面做E加t，下面做E减t，分别得到k和k加N除以二的输出。\n\n画面同时给出了它们依据的两条规律：E和O都是长度减半的变换，下标增加N除以二以后不变；但外面的旋转因子会变号。下一页把这两条规律展开一步，就能看到减号从哪里来。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O25"], "original_stop_ids": [42], "motion": {"kind": "native", "scene": "RButterfly"}, "rehearsal_original_page": 29, "topic": "蝶形合并", "cues": [3.766667], "cue_labels": [""], "duration": 3.8, "animation_cues": [1.2, 3.766667], "animation_labels": ["", ""], "playback": "whole"}, {"id": 18, "chapter": 7, "title": "把周期性和负号在指数里展开", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "把周期性和负号在指数里展开", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n先把E的下标换成k加N除以二。指数里出现二m乘以这个括号，展开就是二mk加mN。这里采样下标带来的二，与N除以二中的二消掉了。\n\n多出来的因子是ω下标N的mN次方，也就是e的负二πim次方；m是整数，所以它等于一，E的值没有改变。O内部的求和使用同样的二m步长，所以结论完全相同。\n\n最后看求和外面的旋转因子。它多出的指数是N除以二，只产生半圈旋转，因此等于负一。子变换不变、外面的因子变号，于是后一半输出自然成为减法。", "overflow": [], "src": "slides/files/rehearsal/O26-segment.mp4", "poster": "rehearsal/posters/O26.png", "original_id": 26, "transition_trimmed": false, "story_key": "O26", "script_speech": "先把E的下标换成k加N除以二。指数里出现二m乘以这个括号，展开就是二mk加mN。这里采样下标带来的二，与N除以二中的二消掉了。\n\n多出来的因子是ω下标N的mN次方，也就是e的负二πim次方；m是整数，所以它等于一，E的值没有改变。O内部的求和使用同样的二m步长，所以结论完全相同。\n\n最后看求和外面的旋转因子。它多出的指数是N除以二，只产生半圈旋转，因此等于负一。子变换不变、外面的因子变号，于是后一半输出自然成为减法。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O26"], "original_stop_ids": [43], "motion": {"kind": "native", "scene": "RButterfly"}, "rehearsal_original_page": 30, "topic": "周期与负号", "cues": [8.5], "cue_labels": [""], "duration": 8.533333333333333, "animation_cues": [0.6, 2.0, 3.4, 4.6, 6.633333, 8.5], "animation_labels": ["", "", "", "", "", ""], "playback": "whole"}, {"id": 19, "chapter": 10, "title": "保留原树：八点递归拆到单点", "detail": "保留原树：八点递归拆到单点", "kind": "content", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "src": "slides/files/rehearsal/RTree.mp4", "poster": "rehearsal/posters/RTree.png", "overflow": [], "story_key": "RTree", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n这里保留原来的树状拆分。八个样本按原下标分成偶数组1、3、0、0和奇数组2、4、0、0。每组再按自己的偶奇位置拆分，得到四个两点组：1、0；3、0；2、0；4、0。最后拆到八个单点。单点DFT等于样本自身，再沿这棵树反向合并即可。长度从1变到2、4、8，需要三层；每层共有四个蝶形。下一页直接数这些操作，不再逐个展开十二个蝶形的数值计算。", "script_speech": "这里保留原来的树状拆分。八个样本按原下标分成偶数组1、3、0、0和奇数组2、4、0、0。每组再按自己的偶奇位置拆分，得到四个两点组：1、0；3、0；2、0；4、0。最后拆到八个单点。单点DFT等于样本自身，再沿这棵树反向合并即可。长度从1变到2、4、8，需要三层；每层共有四个蝶形。下一页直接数这些操作，不再逐个展开十二个蝶形的数值计算。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N18"], "original_stop_ids": [52], "rehearsal_original_page": 31, "topic": "递归拆分", "cues": [5.166667], "cue_labels": [""], "duration": 5.2, "motion": {"kind": "native", "scene": "RTree"}, "animation_cues": [0.866667, 1.866667, 2.766667, 3.666667, 5.166667], "animation_labels": ["固定输入 x=[1,2,3,4,0,0,0,0]，从 N=8 开始。", "按原下标的偶数和奇数拆成两组 N=4：E=[1,3,0,0]，O=[2,4,0,0]。", "偶数分支再拆为 N=2：原下标 (0,4) 给出 [1,0]，(2,6) 给出 [3,0]。", "奇数分支再拆为 N=2：(1,5) 给出 [2,0]，(3,7) 给出 [4,0]。", "四个 N=2 都拆到 N=1；单点 DFT 等于自身，叶子依次是 1,0,3,0,2,0,4,0。"], "playback": "whole"}, {"id": 20, "chapter": 9, "title": "N=8：乘法与加法怎么数", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "N=8：乘法与加法怎么数", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n刚才每一层都处理八个输出，一个蝶形产生两个输出，因此每层四个蝶形。一共有log₂8，也就是三层，所以FFT用了三乘四，共十二个复数权重乘法位置。图中黄色乘号就是这些位置。\n\n再看直接DFT：八个输出，每个分别乘八个权重，合计八乘八，也就是六十四个位置。这里使用同一种常规乘法计数，包含乘1、乘−i和乘零。\n\n乘法之后，还要把八项相加。第一项不需要先加一个零，剩下七项各做一次加法，所以一个输出需要七次；八个输出一共八乘七，即五十六次复数加法。一般N点直接DFT是N(N−1)次加法。FFT每层八次加减、三层二十四次，因此加法数量也是五十六对二十四。画面保留直接DFT的加法式，不重复展示A_FFT公式。", "overflow": [], "src": "slides/files/rehearsal/RCost.mp4", "poster": "rehearsal/posters/RCost.png", "original_id": 33, "transition_trimmed": false, "story_key": "RCost", "script_speech": "刚才每一层都处理八个输出，一个蝶形产生两个输出，因此每层四个蝶形。一共有log₂8，也就是三层，所以FFT用了三乘四，共十二个复数权重乘法位置。图中黄色乘号就是这些位置。\n\n再看直接DFT：八个输出，每个分别乘八个权重，合计八乘八，也就是六十四个位置。这里使用同一种常规乘法计数，包含乘1、乘−i和乘零。\n\n乘法之后，还要把八项相加。第一项不需要先加一个零，剩下七项各做一次加法，所以一个输出需要七次；八个输出一共八乘七，即五十六次复数加法。一般N点直接DFT是N(N−1)次加法。FFT每层八次加减、三层二十四次，因此加法数量也是五十六对二十四。画面保留直接DFT的加法式，不重复展示A_FFT公式。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O33"], "original_stop_ids": [50], "rehearsal_original_page": 32, "topic": "运算计数", "cues": [9.833333], "cue_labels": [""], "duration": 9.866666666666667, "motion": {"kind": "native", "scene": "RCost"}, "animation_cues": [0.866667, 1.733333, 2.6, 3.5, 4.5, 5.466667, 6.466667, 7.566667, 8.566667, 9.833333], "animation_labels": ["N=8 的第 1 层包含四个蝶形；这一层把长度 1 的结果合成为长度 2。", "N=8 的第 2 层包含四个蝶形；这一层把长度 2 的结果合成为长度 4。", "N=8 的第 3 层包含四个蝶形；这一层把长度 4 的结果合成为长度 8。", "长度从 1 到 2、4、8，一共 log₂8=3 层；每层都恰好四个蝶形。", "每个蝶形只计算一次 T=ωO；三层乘四个蝶形，共 12 次一般复数乘法。", "这里按统一的乘法槽位计数：乘 1、乘 −i，以及乘零都包含在 12 内；并未使用特殊因子优化。", "每个蝶形产生 E+T 和 E−T，两次复数加减；每层八次，三层共 24 次。", "直接 DFT 对八个输出逐个计算八项 xₙω₈^{kn}，按同一个一般复数乘法口径是 8×8=64。", "每个输出把八项相加需要七次加法；八个输出共8×7=56次，常规N点DFT为N(N−1)次加法。", "同一口径的权重乘法为64对12；直接DFT的加法为56，FFT的24次加减已在前页计数，此页继续隐藏A_FFT公式。"], "playback": "whole"}, {"id": 21, "chapter": 9, "title": "相同乘法口径下的两条增长曲线", "part": 2, "part_title": "FFT 的复用与 N=8 运算", "kind": "content", "detail": "相同乘法口径下的两条增长曲线", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n横轴是输入长度 N，纵轴 M 是一般复数权重乘法次数，两条曲线共享同一条线性纵轴。直接 DFT 的常规计数是 N²。radix-2 FFT 每层 N/2 个蝶形、共 log₂N 层，因此计数是 (N/2)log₂N；对应算法的输入长度为二的幂，画出的连续函数帮助看增长趋势。标出 N=8 时，直接 DFT 的值是 64，FFT 的值是 12。主图范围较大，这两个数靠近原点，所以用同一函数的真实坐标放大 N 不超过十的区域，并保留主图原来的尺度。最后把 N=8 代入两式核对，仍然得到 64 和 12。这里 FFT 的乘法位置包括乘一等特殊因子，和前页采用同一口径。\n\n现在把横轴的比例尺缩小，让N从32扩大到1024。纵轴同时扩展，仍然对两条曲线使用相同的线性尺度。N=1024时，直接DFT的乘法计数是1024平方，即1,048,576；FFT是512乘log₂1024，也就是512乘10，得到5,120。两种计数相差204.8倍。N越大，共享计算省下的操作越明显。这里比较的是运算次数，不是实测运行时间。", "overflow": [], "src": "slides/files/rehearsal/RGrowth.mp4", "poster": "rehearsal/posters/O33.png", "original_id": 33, "transition_trimmed": false, "story_key": "O33", "script_speech": "横轴是输入长度 N，纵轴 M 是一般复数权重乘法次数，两条曲线共享同一条线性纵轴。直接 DFT 的常规计数是 N²。radix-2 FFT 每层 N/2 个蝶形、共 log₂N 层，因此计数是 (N/2)log₂N；对应算法的输入长度为二的幂，画出的连续函数帮助看增长趋势。标出 N=8 时，直接 DFT 的值是 64，FFT 的值是 12。主图范围较大，这两个数靠近原点，所以用同一函数的真实坐标放大 N 不超过十的区域，并保留主图原来的尺度。最后把 N=8 代入两式核对，仍然得到 64 和 12。这里 FFT 的乘法位置包括乘一等特殊因子，和前页采用同一口径。\n\n现在把横轴的比例尺缩小，让N从32扩大到1024。纵轴同时扩展，仍然对两条曲线使用相同的线性尺度。N=1024时，直接DFT的乘法计数是1024平方，即1,048,576；FFT是512乘log₂1024，也就是512乘10，得到5,120。两种计数相差204.8倍。N越大，共享计算省下的操作越明显。这里比较的是运算次数，不是实测运行时间。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O33"], "original_stop_ids": [50], "rehearsal_original_page": 32, "topic": "增长速度", "cues": [13.766667], "cue_labels": [""], "duration": 13.8, "motion": {"kind": "native", "scene": "RGrowth"}, "animation_cues": [1.0, 2.4, 3.8, 4.766667, 5.933333, 6.9, 8.3, 8.8, 11.4, 11.9, 13.766667], "animation_labels": ["横轴是样本数 N，纵轴 M 是一般复数权重乘法次数；两条曲线使用同一条线性计数轴。", "直接 DFT 的常规权重乘法次数是 N²；曲线按实际数值作图。", "radix-2 FFT 每层 N/2 个蝶形、共 log₂N 层，所以乘法次数是 (N/2)log₂N；算法计数对应 N 为二的幂。", "标出 N=8：同一个输入长度在直接 DFT 曲线上是 64，在 FFT 曲线上是 12。", "用真实坐标放大 N≤10 的区域，清楚看到同一 N=8 的 64 与 12；主图仍保留原来的线性尺度。", "将 N=8 代入两种同口径乘法计数，得到 64 与 12；这个 FFT 计数包含乘 1 等特殊因子。", "", "", "把横轴范围从32缩尺到1024，同时扩大同一条线性计数纵轴，完整保留两条曲线。", "", "N=1024 时，直接DFT为1,048,576个乘法位置，FFT为5,120个；前者是后者的204.8倍。这是运算计数差，非实测运行时间。"], "playback": "whole"}, {"id": 22, "chapter": 0, "kind": "native", "overflow": [], "src": "slides/files/rehearsal/C02-click.mp4", "motion": {"kind": "native", "scene": "C02"}, "story_key": "C02", "original_story_keys": ["C02"], "original_stop_ids": [], "part": 2, "part_title": "FFT 的复用与 N=8 运算", "title": "完整FFT，把刚才的推导落实为代码", "detail": "完整FFT，把刚才的推导落实为代码", "script_speech": "现在推导完整了，我们把它收拢成一个可运行的函数。第一段检查输入长度，并在只剩一个样本时直接返回。\n\n第二段用切片取出偶数和奇数下标，分别递归调用FFT。注意这里按照下标拆分，不是按照样本值的奇偶。\n\n第三段计算旋转因子w，再把它乘到奇数子变换的结果上，得到可以复用的t。第四段执行蝶形合并：一边相加，一边相减，同时得到前后两半的输出。\n\n这四段正好对应刚才的数学推导。算出的系数还可以通过逆变换合成原来的样本。接下来把这套工具用在二维图像上。", "script_stage": "仅本页按指定步骤暂停；点画面、右箭头或空格推进。按单点返回、奇偶递归、旋转因子、蝶形合并四段高亮回顾；这页放在推导之后、逆变换和应用之前。", "notes": "【操作提示】仅本页按指定步骤暂停；点画面、右箭头或空格推进。按单点返回、奇偶递归、旋转因子、蝶形合并四段高亮回顾；这页放在推导之后、逆变换和应用之前。\n\n现在推导完整了，我们把它收拢成一个可运行的函数。第一段检查输入长度，并在只剩一个样本时直接返回。\n\n第二段用切片取出偶数和奇数下标，分别递归调用FFT。注意这里按照下标拆分，不是按照样本值的奇偶。\n\n第三段计算旋转因子w，再把它乘到奇数子变换的结果上，得到可以复用的t。第四段执行蝶形合并：一边相加，一边相减，同时得到前后两半的输出。\n\n这四段正好对应刚才的数学推导。算出的系数还可以通过逆变换合成原来的样本。接下来把这套工具用在二维图像上。", "poster": "rehearsal/posters/C02.png", "rehearsal_original_page": 33, "topic": "FFT 代码", "cues": [1.3, 2.3, 3.3, 4.3, 5.3, 6.833333], "cue_labels": ["", "", "", "", "", ""], "duration": 6.866666666666666, "animation_cues": [1.3, 2.3, 3.3, 4.3, 5.3, 6.833333], "animation_labels": ["", "", "", "", "", ""], "playback": "stepped"}, {"id": 23, "chapter": 14, "title": "带着一维工具，回到图像", "part": 4, "part_title": "频谱与图像应用", "kind": "part", "detail": "带着一维工具，回到图像", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n图像多了一个空间方向，但核心思想没有改变。接下来把一维的基和算法推广到二维，再解决开头的条纹问题。", "overflow": [], "part_typography": {"english": "Tiempos Fine Medium", "postscript": "TiemposFine-Medium", "roman": "IV", "chinese": "FZXiaoBiaoSong-B05"}, "src": "slides/files/rehearsal/RImagesPart.mp4", "poster": "rehearsal/posters/O45.png", "original_id": 45, "transition_trimmed": false, "story_key": "O45", "script_speech": "图像多了一个空间方向，但核心思想没有改变。接下来把一维的基和算法推广到二维，再解决开头的条纹问题。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O45"], "original_stop_ids": [64], "motion": {"kind": "native", "scene": "RImagesPart"}, "rehearsal_original_page": 36, "topic": "二维图像", "cues": [1.6], "cue_labels": [""], "duration": 1.6333333333333333, "animation_cues": [1.6], "animation_labels": ["用频率坐标理解图像"], "playback": "whole"}, {"id": 24, "chapter": 14, "title": "一个频谱点对应什么空间基函数", "detail": "一个频谱点对应什么空间基函数", "kind": "content", "part": 4, "part_title": "频谱与图像应用", "src": "slides/files/rehearsal/RPlaneSpectrum.mp4", "poster": "rehearsal/posters/N20.png", "overflow": [], "story_key": "N20", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n左边选一个频谱坐标 u、v。把这一点的复系数设为 N 的平方，其他系数设为零，逆变换就得到右边这个单位复平面波。它的实部是余弦条纹，虚部是正弦条纹。沿着图像一行扫描，每个位置的复数可以看作一个旋转相量，实轴和虚轴投影就是下面的余弦与正弦曲线。频谱点离中心更远，条纹更密；转动频率向量，条纹方向也转动，频率向量垂直于条纹。接着补上负频率的共轭点，两点各取 N 平方的一半，虚部相消，只剩真实的余弦条纹。最后把频率移到中心，复指数变成一，空间中就是常量。一般图像的中心系数除以 N 平方，等于图像平均亮度。这同时解释了一个谱点的空间基函数、条纹的共轭对，以及直流、方向和高低频。", "script_speech": "左边选一个频谱坐标 u、v。把这一点的复系数设为 N 的平方，其他系数设为零，逆变换就得到右边这个单位复平面波。它的实部是余弦条纹，虚部是正弦条纹。沿着图像一行扫描，每个位置的复数可以看作一个旋转相量，实轴和虚轴投影就是下面的余弦与正弦曲线。频谱点离中心更远，条纹更密；转动频率向量，条纹方向也转动，频率向量垂直于条纹。接着补上负频率的共轭点，两点各取 N 平方的一半，虚部相消，只剩真实的余弦条纹。最后把频率移到中心，复指数变成一，空间中就是常量。一般图像的中心系数除以 N 平方，等于图像平均亮度。这同时解释了一个谱点的空间基函数、条纹的共轭对，以及直流、方向和高低频。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N20"], "original_stop_ids": [65], "rehearsal_original_page": 37, "topic": "频谱与条纹", "cues": [12.2], "cue_labels": [""], "duration": 12.233333333333333, "motion": {"kind": "native", "scene": "RPlaneSpectrum"}, "animation_cues": [0.9, 2.0, 3.0, 5.8, 7.1, 8.4, 9.3, 10.5, 12.2], "animation_labels": ["选择一个非零频谱点", "逆变换成复平面波的实部与虚部", "连接旋转相量与一行复数采样", "扫描条纹并观察余弦与正弦", "增大频率半径并加密条纹", "转动频率方向并转动条纹", "补上共轭频谱点", "共轭相加消掉虚部并留下实条纹", "移到中心直流点并得到常量图像"], "playback": "whole"}, {"id": 25, "chapter": 14, "title": "从逐行到逐列", "part": 4, "part_title": "频谱与图像应用", "kind": "content", "detail": "从逐行到逐列", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n先对每一行做一维FFT，再对结果的每一列做一维FFT，两个方向都从位置坐标变成频率坐标，就得到了完整二维频谱。\n\n右边把零频移到中心，并显示模的对数，方便观察。移位只是重排，取模与对数只是显示方式；真正参与后续运算的，仍是完整复数系数。", "overflow": [], "src": "slides/files/rehearsal/R2DPasses.mp4", "poster": "rehearsal/posters/Q02.png", "original_id": 48, "transition_trimmed": false, "story_key": "Q02", "script_speech": "先对每一行做一维FFT，再对结果的每一列做一维FFT，两个方向都从位置坐标变成频率坐标，就得到了完整二维频谱。\n\n右边把零频移到中心，并显示模的对数，方便观察。移位只是重排，取模与对数只是显示方式；真正参与后续运算的，仍是完整复数系数。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O47", "O48"], "original_stop_ids": [67, 68], "rehearsal_original_page": 38, "topic": "行列变换", "cues": [6.9], "cue_labels": [""], "duration": 6.933333333333334, "motion": {"kind": "native", "scene": "R2DPasses"}, "animation_cues": [1.0, 1.7, 3.2, 4.0, 5.5, 6.9], "animation_labels": ["从二维像素数组开始", "选一行像素", "对每一行做一维 FFT", "再沿每一列处理", "得到二维频率系数", "两次一维变换合成二维 FFT"], "playback": "whole"}, {"id": 26, "chapter": 0, "kind": "native", "overflow": [], "src": "slides/files/rehearsal/C04.mp4", "motion": {"kind": "native", "scene": "C04"}, "story_key": "C04", "original_story_keys": ["C04"], "original_stop_ids": [], "part": 4, "part_title": "频谱与图像应用", "title": "少量频率系数，能保住多少图像内容", "detail": "少量频率系数，能保住多少图像内容", "script_speech": "这里先保留全部频率系数，重建结果与原图一致，只有浮点计算的微小误差。然后按系数的幅值挑选较大的部分，依次保留约百分之十、百分之二、千分之五，其余设为零，再做逆变换。\n\n留意图像的整体轮廓与细小纹理分别怎样变化，以及重建误差怎样变化。少量系数可能已经保住主要结构，但继续减少，细节就会损失，也可能出现重建失真。这里按幅值挑选，所以保留的频率不一定都在低频区域。对于实图像，频率系数共轭成对，我们也成对保留，让重建保持实数。\n\n这就展示了变换压缩的核心想法：用较少的系数近似表示图像。如果只存这些系数及其位置，就有机会减少表示所需的信息；代价是不能完全恢复原图。屏幕上的百分比是保留系数的比例，不是测得的文件大小。实际压缩还需要量化、编码等步骤；常见JPEG主要使用离散余弦变换，也就是DCT，并配合量化和熵编码。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n这里先保留全部频率系数，重建结果与原图一致，只有浮点计算的微小误差。然后按系数的幅值挑选较大的部分，依次保留约百分之十、百分之二、千分之五，其余设为零，再做逆变换。\n\n留意图像的整体轮廓与细小纹理分别怎样变化，以及重建误差怎样变化。少量系数可能已经保住主要结构，但继续减少，细节就会损失，也可能出现重建失真。这里按幅值挑选，所以保留的频率不一定都在低频区域。对于实图像，频率系数共轭成对，我们也成对保留，让重建保持实数。\n\n这就展示了变换压缩的核心想法：用较少的系数近似表示图像。如果只存这些系数及其位置，就有机会减少表示所需的信息；代价是不能完全恢复原图。屏幕上的百分比是保留系数的比例，不是测得的文件大小。实际压缩还需要量化、编码等步骤；常见JPEG主要使用离散余弦变换，也就是DCT，并配合量化和熵编码。", "poster": "rehearsal/posters/C04.png", "rehearsal_original_page": 41, "topic": "频域压缩", "cues": [26.466667], "cue_labels": [""], "duration": 26.5, "animation_cues": [0.9, 1.9, 2.9, 3.7, 8.166667, 13.833333, 26.466667], "animation_labels": ["", "", "", "", "", "", ""], "playback": "whole"}, {"id": 27, "chapter": 14, "title": "图像与条纹的频谱怎样相加", "detail": "图像与条纹的频谱怎样相加", "kind": "content", "part": 4, "part_title": "频谱与图像应用", "src": "slides/files/rehearsal/N21-segment.mp4", "poster": "rehearsal/posters/N21.png", "overflow": [], "story_key": "N21", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n现在把三个对应关系摆在一起。左边是原图及它的频谱，中间是纯条纹及它的两个共轭峰，右边是两者叠加的观测图与频谱。\n\n傅里叶变换是线性的：原图加上干扰，它们的复数频率系数也逐项相加。图中各张频谱共用亮度尺度，不过我们显示的是对数幅度，它本身不能按图像亮度直接相加。\n\n条纹在像素域覆盖整幅图，在频域主要集中到这一对峰。这就是我们希望的信号解耦：换坐标后，干扰的结构显现出来了。", "script_speech": "现在把三个对应关系摆在一起。左边是原图及它的频谱，中间是纯条纹及它的两个共轭峰，右边是两者叠加的观测图与频谱。\n\n傅里叶变换是线性的：原图加上干扰，它们的复数频率系数也逐项相加。图中各张频谱共用亮度尺度，不过我们显示的是对数幅度，它本身不能按图像亮度直接相加。\n\n条纹在像素域覆盖整幅图，在频域主要集中到这一对峰。这就是我们希望的信号解耦：换坐标后，干扰的结构显现出来了。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N21"], "original_stop_ids": [69], "rehearsal_original_page": 39, "topic": "频谱叠加", "cues": [7.966667], "cue_labels": [""], "duration": 8.0, "motion": {"kind": "native", "scene": "RLinearity"}, "animation_cues": [0.9, 1.8, 2.7, 3.6, 4.4, 5.3, 6.2, 7.2, 7.966667], "animation_labels": ["显示原图信号 f", "显示原图频谱 F", "加入纯条纹信号", "显示纯条纹的两个共轭峰", "标出条纹的正负频率位置", "将原图与条纹合成观测图", "显示同一尺度下的合成频谱", "说明线性相加发生在复系数中", "定位合成频谱里的同一对条纹峰"], "playback": "whole"}, {"id": 28, "chapter": 14, "title": "压下条纹的共轭双峰，再重建", "detail": "压下条纹的共轭双峰，再重建", "kind": "content", "part": 4, "part_title": "频谱与图像应用", "src": "slides/files/rehearsal/N22-segment.mp4", "poster": "rehearsal/posters/N22.png", "overflow": [], "story_key": "N22", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n接着只处理这对峰。实值图像的频率系数具有共轭对称性，所以正负频率的两个位置要一起压下去。\n\n用保留其他位置、将这两个位置置零的掩膜乘频率系数，再做二维逆变换，就得到右上角的重建图。条纹明显减弱，细纹理大多保留。\n\n这个例子已知条纹频率；如果原图在同一个频率也有内容，它也会受到损失。任意水印未必占据可单独删去的两个峰，所以不能把这个结果推广成通用水印去除。", "script_speech": "接着只处理这对峰。实值图像的频率系数具有共轭对称性，所以正负频率的两个位置要一起压下去。\n\n用保留其他位置、将这两个位置置零的掩膜乘频率系数，再做二维逆变换，就得到右上角的重建图。条纹明显减弱，细纹理大多保留。\n\n这个例子已知条纹频率；如果原图在同一个频率也有内容，它也会受到损失。任意水印未必占据可单独删去的两个峰，所以不能把这个结果推广成通用水印去除。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["N22"], "original_stop_ids": [70], "rehearsal_original_page": 40, "topic": "共轭陷波", "cues": [2.6], "cue_labels": [""], "duration": 2.6333333333333333, "motion": {"kind": "native", "scene": "RLinearity"}, "animation_cues": [1.1, 2.6], "animation_labels": ["同时移除正负频率峰", "对过滤后的复系数做逆变换重建"], "playback": "whole"}, {"id": 29, "chapter": 18, "title": "傅里叶圆链画出一个音符", "part": 4, "part_title": "频谱与图像应用", "kind": "content", "detail": "傅里叶圆链画出一个音符", "notes": "【操作提示】进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。\n\n先将一条闭合音符轮廓沿弧长等距采样，把每个点写成复数，然后计算 DFT 系数。未加权的复指数对应单位圆。乘上复系数后，模决定半径，幅角决定初相。将箭头首尾相接，加入六十一个非零频率，让它们按各自的正负频率旋转。指数采用逆变换的正号，末端的复数和逐渐画出同一条轮廓。一周期后曲线闭合，在最终音符旁保留一句谢谢。", "overflow": [], "src": "slides/files/rehearsal/REpicycle.mp4", "poster": "rehearsal/posters/O55.png", "original_id": 55, "transition_trimmed": true, "story_key": "O55", "script_speech": "先将一条闭合音符轮廓沿弧长等距采样，把每个点写成复数，然后计算 DFT 系数。未加权的复指数对应单位圆。乘上复系数后，模决定半径，幅角决定初相。将箭头首尾相接，加入六十一个非零频率，让它们按各自的正负频率旋转。指数采用逆变换的正号，末端的复数和逐渐画出同一条轮廓。一周期后曲线闭合，在最终音符旁保留一句谢谢。", "script_stage": "进入本页后一次播放完整，最后停住。点击画面、右箭头或空格翻到下一页。", "original_story_keys": ["O55"], "original_stop_ids": [79], "motion": {"kind": "native", "scene": "REpicycle"}, "rehearsal_original_page": 43, "topic": "傅里叶圆链", "cues": [29.866667], "cue_labels": [""], "duration": 29.9, "animation_cues": [1.366667, 3.033333, 4.7, 6.5, 7.866667, 12.866667, 17.866667, 22.866667, 27.866667, 29.866667], "animation_labels": ["每个频率先从同样的单位圆开始", "乘上系数的模：圆的半径变成各自的权重", "系数的幅角决定每根箭头的初始方向", "把箭头首尾相接：复数相加就是向量相加", "加入其余傅里叶系数：每个圆以自己的频率旋转", "圆链开始旋转：末端画出音符的第一段", "继续第二个四分之一周期：同一条轨迹不断延长", "继续第三个四分之一周期：轮廓逐渐连起来", "完成整整一个周期：音符闭合，圆链回到初相", "保留画出的音符，在最后一页轻轻收束"], "playback": "whole"}];</script><script src="player/rehearsal-player.js?v=20261004"></script><script src="player/presenter-tools.js?v=20261003"></script><script>
