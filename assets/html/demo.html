<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>课程关系图</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #f8f9fa;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      overflow: hidden;
    }
    .graph-container {
      position: relative;
      width: 100%;
      height: 100vh; /* 让 iframe 内全屏占位 */
      background: #f8f9fa;
      cursor: grab;
    }
    .graph-container:active { cursor: grabbing; }

    /* 悬浮信息卡 */
    .node-info {
      position: absolute;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      max-width: 320px;
      display: none;
      z-index: 100;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.5;
    }
    .node-info h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #1f2937;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 6px;
    }
    .node-info .muted { color: #6b7280; }
    .node-info .block { margin-top: 8px; }

    /* 高亮样式 */
    .node:hover, .node-highlight {
      stroke: #111827;
      stroke-width: 3px;
      filter: drop-shadow(0 0 5px rgba(0,0,0,0.25));
    }
    .link { stroke: #bdbdbd; stroke-width: 1.5; stroke-opacity: 0.6; }
    .link-highlight { stroke: #ef4444; stroke-width: 2; stroke-opacity: 1; }

    /* 控件：缩放 / 重置 */
    .zoom-controls {
      position: absolute; top: 12px; right: 12px;
      display: flex; flex-direction: column; gap: 8px; z-index: 50;
    }
    .zoom-btn, .reset-btn {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 999px;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08); font-weight: 700;
    }
    .zoom-btn:hover, .reset-btn:hover { background: #f3f4f6; }
    .reset-btn {
      position: absolute; top: 12px; left: 12px; width: auto; padding: 0 12px; font-weight: 500;
      color: #fff; background: #3b82f6; border-color: #3b82f6; z-index: 50;
    }
    .reset-btn:hover { background: #2563eb; }

    /* 顶部工具条：类别 + 语言 */
    .category-bar {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 60; display: flex; gap: 8px; align-items: center;
      background: rgba(255,255,255,0.9); backdrop-filter: saturate(1.2) blur(2px);
      border: 1px solid #e5e7eb; border-radius: 999px; padding: 6px 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      font-size: 13px; color: #374151;
    }
    .category-bar select {
      border: 1px solid #e5e7eb; border-radius: 999px; padding: 6px 10px; background: #fff;
      font-size: 13px; outline: none;
    }
    .category-bar .pill {
      padding: 6px 10px; border-radius: 999px; background: #111827; color: #fff; font-weight: 600;
    }
    .lang-btn{
      border: 1px solid #e5e7eb; border-radius: 999px; background:#fff;
      padding: 6px 10px; cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .lang-btn:hover{ background:#f3f4f6; }
  </style>
</head>
<body>
  <div class="graph-container" id="graph">
    <div class="category-bar">
      <span class="pill" id="pillLabel">类别</span>
      <select id="categorySelect">
        <option value="__all__">所有类别</option>
        <!-- 其余选项将由脚本根据数据自动填充 -->
      </select>
      <button id="langToggle" class="lang-btn" title="Switch Language">EN</button>
    </div>

    <div class="zoom-controls">
      <div class="zoom-btn" id="zoomIn">+</div>
      <div class="zoom-btn" id="zoomOut">−</div>
    </div>
    <button class="reset-btn" id="resetView">重置视图</button>
    <div class="node-info" id="nodeInfo"></div>
  </div>

  <script>
    // ---------- 配置 ----------
    const BASEURL = ""; // 若在项目页，建议用 ?base=/repo 或在 iframe 外注入 __J_BASEURL__
    const urlParams = new URLSearchParams(window.location.search);
    const qsBase = urlParams.get("base");
    const BASE = window.__J_BASEURL__ || qsBase || BASEURL;

    // 默认数据路径
    const DATA_URL = `${BASE}/assets/html/curriculum_with_related.json`;

    // 类别配色（可增补）
    const categoryColors = {
      "AI": "#3498db",
      "CS": "#e74c3c",
      "Math": "#2ecc71",
      "Physics": "#f39c12",
      "Chemistry": "#8e44ad",
      "EarthScience": "#2c3e50",
      "Finance": "#27ae60",
      "Humanities": "#7f8c8d",
      "OPT": "#16a085"
    };

    // —— 多语言文案 —— //
    let currentLang = 'zh';
    const i18n = {
      zh: {
        pill: '类别',
        all: '所有类别',
        reset: '重置视图',
        category: '类别',
        status: '状态',
        credits: '学分',
        related: '相关课程',
        unknown: '—',
        completed: '已完成',
        ongoing: '进行中',
        planned: '计划中',
        audited: '旁听',
        withdrawn: '退课',
        langBtn: 'EN'
      },
      en: {
        pill: 'Category',
        all: 'All',
        reset: 'Reset',
        category: 'Category',
        status: 'Status',
        credits: 'Credits',
        related: 'Related',
        unknown: '—',
        completed: 'Completed',
        ongoing: 'Ongoing',
        planned: 'Planned',
        audited: 'Audited',
        withdrawn: 'Withdrawn',
        langBtn: '中'
      }
    };
    function stageLabel(stage) {
      const map = i18n[currentLang];
      return map[stage] || stage || map.unknown;
    }
    function displayName(d) {
      if (currentLang === 'en' && d.en_name) return d.en_name;
      return d.name || d.en_name || d.id;
    }

    // —— 透明度映射（含别名） —— //
    const stageOpacityMap = {
      // 高中
      "high_school": 0.5, "highschool": 0.5, "hs": 0.5,
      // 大一上
      "undergrad_year1_fall": 0.6, "y1_fall": 0.6, "freshman_fall": 0.6,
      // 大一下
      "undergrad_year1_spring": 0.7, "y1_spring": 0.7, "freshman_spring": 0.7,
      // 大二上
      "undergrad_year2_fall": 0.8, "y2_fall": 0.8, "sophomore_fall": 0.8
    };
    function nodeOpacity(d) {
      if ((d.stage || '').toLowerCase() === 'ongoing') return 0.9; // 正在修读优先生效
      const key = (d.stage_detail || '').toLowerCase();
      return stageOpacityMap[key] ?? 1.0;
    }
    function nodeDash(d) {
      return ((d.stage || '').toLowerCase() === 'ongoing') ? "4 2" : "none";
    }

    // ---------- 状态 ----------
    let allCourses = [];
    let currentCategory = "__all__";
    let simulation, svg, g, transform = d3.zoomIdentity, zoom;

    // DOM
    const graphContainer = document.getElementById('graph');
    const nodeInfo = document.getElementById('nodeInfo');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');
    const resetBtn = document.getElementById('resetView');
    const categorySelect = document.getElementById('categorySelect');
    const pillLabel = document.getElementById('pillLabel');
    const langToggle = document.getElementById('langToggle');

    // ---------- 初始化图 ----------
    function initGraph() {
      if (svg) svg.remove();
      const width = graphContainer.clientWidth;
      const height = graphContainer.clientHeight;

      svg = d3.select("#graph")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", [0, 0, width, height])
        .attr("preserveAspectRatio", "xMidYMid meet")
        .style("background-color", "#f8f9fa");

      g = svg.append("g");

      simulation = d3.forceSimulation()
        .force("link", d3.forceLink().id(d => d.id).distance(120))
        .force("charge", d3.forceManyBody().strength(-420))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(45));

      zoom = d3.zoom()
        .scaleExtent([0.1, 5])
        .on("zoom", (event) => {
          transform = event.transform;
          g.attr("transform", transform);
        });

      svg.call(zoom);
    }

    // ---------- 文案刷新 ----------
    function refreshStaticTexts() {
      const t = i18n[currentLang];
      pillLabel.textContent = t.pill;
      // 更新“所有类别/All”这个选项的显示文本（保留 value 不变）
      const firstOpt = categorySelect.querySelector('option[value="__all__"]');
      if (firstOpt) firstOpt.textContent = t.all;
      resetBtn.textContent = t.reset;
      langToggle.textContent = t.langBtn;
    }

    // ---------- 过滤 ----------
    function getFilteredCourses() {
      if (currentCategory === "__all__") return [...allCourses];
      return allCourses.filter(c => c.category === currentCategory);
    }

    // ---------- 渲染 ----------
    function renderGraph(courses) {
      initGraph();
      g.selectAll("*").remove();

      const nodes = courses;
      const links = [];
      const idSet = new Set(nodes.map(n => n.id));
      nodes.forEach(n => {
        (n.related || []).forEach(tid => {
          if (idSet.has(tid)) links.push({ source: n.id, target: tid });
        });
      });

      const link = g.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", "link");

      const node = g.append("g")
        .attr("class", "nodes")
        .selectAll("circle")
        .data(nodes)
        .enter().append("circle")
        .attr("class", "node")
        .attr("r", 22)
        .attr("fill", d => categoryColors[d.category] || "#95a5a6")
        .attr("stroke", "#fff")
        .attr("stroke-width", 2)
        .style("opacity", d => nodeOpacity(d))
        .style("stroke-dasharray", d => nodeDash(d))
        .on("click", showNodeInfo)
        .on("mouseover", handleNodeOver)
        .on("mouseout", handleNodeOut)
        .call(d3.drag()
          .on("start", dragStarted)
          .on("drag", dragged)
          .on("end", dragEnded)
        );

      const label = g.append("g")
        .attr("class", "labels")
        .selectAll("text")
        .data(nodes)
        .enter().append("text")
        .text(d => displayName(d))
        .attr("text-anchor", "middle")
        .attr("dy", 35)
        .attr("font-size", 12)
        .attr("fill", "#1f2937")
        .attr("pointer-events", "none");

      simulation.nodes(nodes);
      simulation.force("link").links(links);
      simulation.alpha(0.6).restart();

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node
          .attr("cx", d => d.x)
          .attr("cy", d => d.y);

        label
          .attr("x", d => d.x)
          .attr("y", d => d.y);
      });

      function handleNodeOver(event, d) {
        d3.select(event.target).classed("node-highlight", true);
        g.selectAll(".link").classed("link-highlight",
          l => l.source.id === d.id || l.target.id === d.id);
      }
      function handleNodeOut(event, d) {
        d3.select(event.target).classed("node-highlight", false);
        g.selectAll(".link").classed("link-highlight", false);
      }
      function dragStarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      }
      function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
      function dragEnded(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      }
    }

    // ---------- 信息卡 ----------
    function showNodeInfo(event, d) {
      const t = i18n[currentLang];
      const relatedNames = (d.related || [])
        .map(id => (allCourses.find(c => c.id === id) || {}))
        .map(displayName)
        .filter(Boolean)
        .join(currentLang === 'en' ? ', ' : '，');

      nodeInfo.innerHTML = `
        <h3>${displayName(d)} <span class="muted">(${d.id})</span></h3>
        <div><strong>${t.category}：</strong>${d.category || t.unknown}</div>
        <div><strong>${t.status}：</strong>${stageLabel(d.stage)} <span class="muted">(${d.stage_detail || t.unknown})</span></div>
        ${d.credits ? `<div><strong>${t.credits}：</strong>${d.credits}</div>` : ""}
        ${d.description ? `<div class="muted block">${d.description}</div>` : ""}
        <div class="block"><strong>${t.related}：</strong>${relatedNames || t.unknown}</div>
      `;
      nodeInfo.style.display = "block";

      const { x, y } = d;
      const tx = transform.applyX(x), ty = transform.applyY(y);
      const W = graphContainer.clientWidth, H = graphContainer.clientHeight;

      let left = tx + 24, top = ty - 10;
      if (left + nodeInfo.offsetWidth > W) left = tx - nodeInfo.offsetWidth - 24;
      if (top + nodeInfo.offsetHeight > H) top = H - nodeInfo.offsetHeight - 12;
      if (top < 12) top = 12;

      nodeInfo.style.left = `${left}px`;
      nodeInfo.style.top = `${top}px`;
    }

    // 点击空白处关闭信息卡
    document.addEventListener("click", (e) => {
      const isNode = e.target.tagName.toLowerCase() === "circle";
      if (!isNode) nodeInfo.style.display = "none";
    });

    // ---------- 控件 ----------
    function bindControls() {
      zoomInBtn.addEventListener("click", () => svg.transition().call(zoom.scaleBy, 1.2));
      zoomOutBtn.addEventListener("click", () => svg.transition().call(zoom.scaleBy, 0.8));
      resetBtn.addEventListener("click", () => {
        svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
      });

      // 类别下拉：变更后重绘
      categorySelect.addEventListener("change", () => {
        currentCategory = categorySelect.value;
        renderGraph(getFilteredCourses());
      });

      // 语言切换
      langToggle.addEventListener("click", () => {
        currentLang = (currentLang === 'zh' ? 'en' : 'zh');
        refreshStaticTexts();
        renderGraph(getFilteredCourses()); // 重绘以更新所有文本 & 样式
      });

      window.addEventListener("resize", () => {
        if (allCourses.length) renderGraph(getFilteredCourses());
      });
    }

    // ---------- 加载数据 & 填充类别 ----------
    async function main() {
      bindControls();
      initGraph();
      try {
        const resp = await fetch(DATA_URL, { cache: "no-store" });
        if (!resp.ok) throw new Error(`加载失败 ${resp.status}`);
        const data = await resp.json();
        allCourses = Array.isArray(data.nodes) ? data.nodes : [];
        if (!allCourses.length) throw new Error("JSON 中未找到 nodes");

        // 自动填充现有类别
        const categories = Array.from(new Set(allCourses.map(d => d.category).filter(Boolean))).sort();
        for (const cat of categories) {
          const opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          categorySelect.appendChild(opt);
        }

        refreshStaticTexts();              // 初次文案
        renderGraph(getFilteredCourses()); // 初次渲染
      } catch (err) {
        console.error(err);
        d3.select("#graph").append("div")
          .style("position","absolute").style("left","50%").style("top","50%")
          .style("transform","translate(-50%,-50%)")
          .style("color","#ef4444").style("font","14px/1.6 system-ui")
          .style("background","#fff").style("padding","10px 14px")
          .style("border","1px solid #e5e7eb").style("border-radius","8px")
          .text("加载课程数据失败，请检查路径或 JSON 格式。");
      }
    }
    main();
  </script>
</body>
</html>
