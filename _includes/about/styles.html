<style>
    /* 
       Sleek, Minimalist, Swiss-inspired About Page Styling 
       Focus on typography, perfect spacing, and a unified monochromatic palette with subtle accents.
    */

    :root {
        --about-accent: var(--link-color, #0d6efd);
        --about-accent-hover: #0b5ed7;
        --about-border-radius: 12px;
        --about-spacing-sm: 1rem;
        --about-spacing-md: 1.5rem;
        --about-spacing-lg: 2.5rem;
        --about-transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        --about-glass-bg: rgba(255, 255, 255, 0.02);
        --about-glass-border: rgba(255, 255, 255, 0.08);
        --about-glass-border-hover: rgba(255, 255, 255, 0.2);
        --about-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        --about-shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    [data-mode="light"] {
        --about-glass-bg: #fdfdfd;
        --about-glass-border: rgba(0, 0, 0, 0.06);
        --about-glass-border-hover: rgba(0, 0, 0, 0.15);
        --about-shadow: 0 2px 10px rgba(0, 0, 0, 0.02);
        --about-shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    /* Core Structural Components */
    .glass-card {
        background: var(--about-glass-bg);
        border: 1px solid var(--about-glass-border);
        border-radius: var(--about-border-radius);
        padding: var(--about-spacing-md);
        transition: var(--about-transition);
        height: 100%;
        box-shadow: var(--about-shadow);
    }

    .glass-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--about-shadow-hover);
        border-color: var(--about-glass-border-hover);
    }

    /* Icon Containers */
    .icon-box {
        font-size: 1.5rem;
        margin-bottom: var(--about-spacing-sm);
        display: inline-flex;
        color: var(--text-color);
        opacity: 0.7;
        transition: var(--about-transition);
    }

    .glass-card:hover .icon-box {
        opacity: 1;
        color: var(--about-accent);
        transform: scale(1.05);
    }

    /* Timeline & Education Refinements */
    .timeline-item {
        position: relative;
        border-left: 1px solid var(--about-glass-border);
        padding-left: var(--about-spacing-md);
        padding-bottom: var(--about-spacing-md);
        transition: var(--about-transition);
    }

    .timeline-item:last-child {
        border-left-color: transparent;
        padding-bottom: 0;
    }

    .timeline-item::before {
        content: '';
        position: absolute;
        left: -4.5px;
        top: 6px;
        width: 8px;
        height: 8px;
        background: var(--about-glass-border-hover);
        border-radius: 50%;
        transition: var(--about-transition);
    }

    .timeline-item:hover::before {
        background: var(--about-accent);
        transform: scale(1.3);
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
    }

    .timeline-item:hover {
        border-left-color: var(--about-glass-border-hover);
    }

    /* Tag & Badge System Minimalist Refinements */
    .custom-badge,
    .course-badge {
        font-size: 0.75rem;
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        background: var(--about-glass-bg);
        border: 1px solid var(--about-glass-border);
        color: var(--text-muted-color, #6c757d);
        font-weight: 500;
        margin-left: 0.25rem;
        display: inline-flex;
        align-items: center;
        transition: var(--about-transition);
        line-height: 1.2;
        letter-spacing: 0.02em;
    }

    .course-badge {
        margin-left: 0.5rem;
    }

    a.course-badge:hover,
    a.custom-badge:hover {
        background: transparent;
        border-color: var(--about-accent);
        color: var(--about-accent);
    }

    /* Books & Publication Cards */
    .book-card {
        background: var(--about-glass-bg);
        border: 1px solid var(--about-glass-border);
        border-radius: var(--about-border-radius);
        padding: var(--about-spacing-md);
        transition: var(--about-transition);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .book-card:hover {
        transform: translateY(-2px);
        border-color: var(--about-glass-border-hover);
        box-shadow: var(--about-shadow-hover);
    }

    .book-card a {
        color: var(--heading-color);
        transition: var(--about-transition);
        font-weight: 600;
        display: inline-block;
        margin-bottom: 0.5rem;
    }

    .book-card a:hover {
        color: var(--about-accent);
    }

    /* Friends / Buttons */
    .custom-btn-outline {
        display: inline-flex;
        align-items: center;
        padding: 0.35rem 0.85rem;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-color);
        background: var(--about-glass-bg);
        border: 1px solid var(--about-glass-border);
        border-radius: 100px;
        transition: var(--about-transition);
        text-decoration: none;
        letter-spacing: 0.01em;
    }

    .custom-btn-outline i {
        opacity: 0.7;
        transition: var(--about-transition);
    }

    .custom-btn-outline:hover {
        border-color: var(--about-glass-border-hover);
        background: transparent;
        transform: translateY(-1px);
        box-shadow: var(--about-shadow);
    }

    .custom-btn-outline:hover i {
        color: var(--about-accent);
        opacity: 1;
    }

    /* Details Toggle Styling */
    summary {
        cursor: pointer;
        padding: var(--about-spacing-sm) 0;
        transition: var(--about-transition);
        list-style: none;
        /* remove default arrow */
        display: flex;
        align-items: center;
        border-bottom: 1px solid transparent;
        margin-bottom: 1rem;
    }

    summary::-webkit-details-marker {
        display: none;
    }

    summary:hover {
        color: var(--about-accent) !important;
    }

    summary:hover i {
        color: var(--about-accent) !important;
    }

    /* Publication entries hover effect */
    .glass-card .d-flex {
        transition: var(--about-transition);
    }

    .glass-card .d-flex:hover .fs-2 {
        color: var(--about-accent) !important;
        transform: scale(1.05);
        transition: var(--about-transition);
    }

    /* Smooth Scrolling */
    html {
        scroll-behavior: smooth;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {

        .glass-card,
        .book-card {
            padding: var(--about-spacing-sm);
        }

        .timeline-item {
            padding-left: var(--about-spacing-md);
        }
    }
</style>
