# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) 预装系统依赖（保险起见）
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6

      # 2) 设置 Ruby（不启用 bundler 自动缓存，避免时序问题）
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      # 3) 确保 Gemfile 中固定 sass-embedded 版本（若未写则追加）
      - name: Pin sass-embedded version
        run: |
          if ! grep -q 'sass-embedded' Gemfile; then
            echo 'gem "sass-embedded", "~> 1.77"' >> Gemfile
          else
            sed -i 's/gem\s\+"sass-embedded".*/gem "sass-embedded", "~> 1.77"/' Gemfile || true
          fi

      # 4) 彻底清理残留安装目录，避免 ENOENT/竞态
      - name: Clean bundle vendor cache
        run: |
          rm -rf vendor/bundle
          rm -rf ~/.bundle
          rm -rf .bundle

      # 5) 严格按顺序安装，禁用并行，减少竞态
      - name: Bundle install
        env:
          BUNDLE_WITHOUT: "development:test"
          BUNDLE_JOBS: "1"
        run: |
          bundle config set path vendor/bundle
          bundle config set without 'development:test'
          bundle install --jobs 1 --retry 3

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4