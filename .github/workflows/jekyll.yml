# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh-pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04   # 避免 20.04 的老 glibc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先装系统依赖（sass-embedded 需要较新的 libstdc++）
      - name: Install system deps for sass-embedded
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false   # 先别让它自动装，等我们准备好再装

      # （可选）若 sass-embedded 最新版装不上，可锁定稳定分支
      # - name: Pin sass-embedded version (optional)
      #   run: |
      #     if ! grep -q 'sass-embedded' Gemfile; then
      #       echo 'gem "sass-embedded", "~> 1.77"' >> Gemfile
      #     fi
      #     bundle update sass-embedded

      - name: Bundle install
        env:
          BUNDLE_WITHOUT: "development:test"
        run: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4