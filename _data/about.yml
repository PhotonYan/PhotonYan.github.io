# Bio
basic_info:
  lead: |
    I am an undergraduate student at <strong>Peking University</strong>, YuanPei College. <br>
    I am currently majoring in <em>Artificial Intelligence</em> while pursuing a double degree in <em>Physics</em>, focusing on exploring the intersection of these fields through interdisciplinary knowledge and research. 

# Research Interests
interests:
  - title: AI for Science
    icon: fas fa-flask
    desc: AI-driven scientific modeling across molecules, proteins, chemistry, biology, and physics.
    note: >
      Current focus: AIDD, AI4Chem, AI4Bio, AI4Phy, molecule generation, protein cofolding,
      molecular dynamics, and AI for LHC-style high-energy physics problems.
  - title: General Machine Learning
    icon: fas fa-brain
    desc: Representation learning, pretraining paradigms, and model architecture design.
    note: >
      Current focus: designing objectives and architectures that transfer across domains, with
      attention to structure, scale, data efficiency, and the inductive biases behind useful representations.
  - title: Efficient Computation
    icon: fas fa-microchip
    desc: Algorithmic efficiency for scalable learning, simulation, and scientific computing.
    note: >
      Current focus: faster sampling and generation, efficient geometric algorithms, and computational methods that make large scientific models practical rather than merely expressive.

