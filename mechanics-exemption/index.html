<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17233c" />
  <title>力学免修历年真题与详细解答 · 2013–2025</title>
  <style>
    :root { color-scheme: light dark; --navy:#17233c; --indigo:#4d4ac7; --paper:#f3f5fb; --ink:#172033; --muted:#687086; --line:rgba(23,35,60,.12); }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:var(--ink); }
    body { min-height:100dvh; overflow:hidden; }
    .app { height:100dvh; display:grid; grid-template-rows:auto 1fr; }
    header { position:relative; z-index:2; display:flex; align-items:center; gap:16px; padding:calc(11px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 11px max(14px,env(safe-area-inset-left)); background:linear-gradient(110deg,var(--navy),#28395f 62%,#3b3e8d); color:white; box-shadow:0 6px 28px rgba(23,35,60,.18); }
    .mark { width:10px; height:42px; border-radius:8px; background:linear-gradient(#8b7cf6,#6ac6c1); flex:0 0 auto; }
    .title { min-width:0; flex:1; }
    h1 { margin:0; font-size:clamp(16px,3.9vw,21px); font-weight:760; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sub { margin-top:3px; font-size:12px; color:rgba(255,255,255,.72); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .actions { display:flex; gap:8px; }
    .btn { appearance:none; border:1px solid rgba(255,255,255,.28); color:white; background:rgba(255,255,255,.10); text-decoration:none; border-radius:11px; padding:9px 12px; font-size:13px; font-weight:650; backdrop-filter:blur(10px); }
    .btn:hover { background:rgba(255,255,255,.18); }
    main { position:relative; min-height:0; padding:10px; }
    .viewer { height:100%; width:100%; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:white; box-shadow:0 12px 40px rgba(23,35,60,.12); }
    iframe { width:100%; height:100%; border:0; display:block; background:white; }
    .loading { position:absolute; inset:10px; display:grid; place-items:center; pointer-events:none; color:var(--muted); z-index:0; }
    .loading-card { text-align:center; max-width:460px; padding:26px; }
    .spinner { width:34px; height:34px; border:3px solid rgba(77,74,199,.15); border-top-color:var(--indigo); border-radius:50%; margin:0 auto 14px; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading strong { display:block; color:var(--ink); margin-bottom:6px; }
    .loading p { margin:0; line-height:1.55; font-size:13px; }
    @media(max-width:640px){ header{gap:10px}.mark{height:36px;width:7px}.sub{display:none}.btn span{display:none}.btn{padding:8px 10px}main{padding:0}.viewer{border:0;border-radius:0;box-shadow:none}.loading{inset:0} }
    @media(prefers-color-scheme:dark){ :root{--paper:#0f1420;--ink:#eef2ff;--muted:#a6aec2;--line:rgba(255,255,255,.1)} .viewer,iframe{background:#171717} }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="mark" aria-hidden="true"></div>
      <div class="title">
        <h1>力学免修历年真题与详细解答</h1>
        <div class="sub">2013–2025 · 50 页 · TikZ 重绘 · 逐题详解</div>
      </div>
      <div class="actions"><a class="btn" href="./mechanics.pdf" target="_blank" rel="noopener">↗ <span>打开 PDF</span></a></div>
    </header>
    <main>
      <div class="loading"><div class="loading-card"><div class="spinner"></div><strong>正在加载 PDF…</strong><p>PDF 已静态托管在本站，加载速度取决于你的网络。</p></div></div>
      <div class="viewer"><iframe src="./mechanics.pdf#view=FitH&toolbar=1&navpanes=0" title="力学免修历年真题与详细解答 PDF"></iframe></div>
    </main>
  </div>
</body>
</html>
